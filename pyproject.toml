[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-team"
version = "0.1.0"
description = "A generic hierarchical dynamic multi-agent collaboration framework (ATT)."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
authors = [
    {name = "mindofcharles"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.6.1",
    "jsonschema>=4.18.0",
    "sqlalchemy>=2.0.0",
    "tokenizers>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "coverage[toml]>=7.6.0",
    "mypy>=1.11.0",
    "numpy",
    "ruff>=0.6.0",
]

[tool.setuptools.package-data]
ai_team_team = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["ai_team_team"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.',
]
fail_under = 70
show_missing = true
skip_covered = true
