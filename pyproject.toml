[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-team-team"
version = "0.1.0"
description = "A generic hierarchical dynamic multi-agent collaboration framework (ATT)."
readme = "README.md"
requires-python = ">=3.11"

license = "Apache-2.0"
license-files = ["LICENSE.txt"]

authors = [
    { name = "mindofcharles" }
]

keywords = [
    "multi-agent",
    "multi-agent-systems",
    "ai-agents",
    "agent-framework",
    "agent-collaboration",
    "hierarchical-agents",
    "llm",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Operating System :: OS Independent",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",

    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.6.1",
    "jsonschema>=4.18.0",
    "sqlalchemy>=2.0.0",
    "tokenizers>=0.13.0",
]


[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "coverage[toml]>=7.6.0",
    "mypy>=1.11.0",
    "numpy",
    "ruff>=0.6.0",
]


[project.urls]
Homepage = "https://github.com/AI-Team-Team/AI-Team-Team"
Repository = "https://github.com/AI-Team-Team/AI-Team-Team"
Documentation = "https://github.com/AI-Team-Team/AI-Team-Team/tree/main/docs"
Issues = "https://github.com/AI-Team-Team/AI-Team-Team/issues"


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
ai_team_team = ["py.typed"]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]


[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true


[tool.coverage.run]
branch = true
source = ["ai_team_team"]


[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.',
]
fail_under = 70
show_missing = true
skip_covered = true
