name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Install Coverage
        id: coverage_install
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: python -m pip install "coverage[toml]>=7.6.0"

      - name: Run tests
        if: ${{ matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13' }}
        run: python -m scripts.acceptance --suite full --all-output --output "${{ runner.temp }}/att-full"

      - name: Run tests with Coverage
        id: coverage_tests
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: python -m scripts.acceptance --suite full --all-output --coverage --output "${{ runner.temp }}/att-full"

      - name: Generate Coverage reports
        id: coverage_reports
        if: >-
          ${{ !cancelled() && steps.coverage_install.outcome == 'success' &&
              (steps.coverage_tests.outcome == 'success' || steps.coverage_tests.outcome == 'failure') }}
        shell: bash
        env:
          COVERAGE_FILE: ${{ runner.temp }}/att-full/.coverage
        run: |
          if [[ -f "$COVERAGE_FILE" ]]; then
            python -m coverage html --fail-under=0 -d "${{ runner.temp }}/att-full/htmlcov"
            python -m coverage xml --fail-under=0 -o "${{ runner.temp }}/att-full/coverage.xml"
            python -m coverage report -m
          else
            echo "No coverage data was generated."
            exit 1
          fi

      - name: Upload Coverage reports
        if: >-
          ${{ !cancelled() &&
              (steps.coverage_reports.outcome == 'success' || steps.coverage_reports.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: att-coverage
          path: |
            ${{ runner.temp }}/att-full/htmlcov/
            ${{ runner.temp }}/att-full/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/att-full/result.json
            ${{ runner.temp }}/att-full/unittest.log
            ${{ runner.temp }}/att-full/diagnostics/
            ${{ runner.temp }}/att-full/coverage.json
          if-no-files-found: warn
          retention-days: 14

  extended-reliability:
    name: Extended reliability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Extended schedules and slow-writer pressure
        run: python -m scripts.acceptance --suite extended --all-output --seeds 8 --operations 96 --output "${{ runner.temp }}/att-extended"
      - name: Upload reliability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reliability-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/att-extended/result.json
            ${{ runner.temp }}/att-extended/unittest.log
            ${{ runner.temp }}/att-extended/diagnostics/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src test typecheck examples scripts
      - run: mypy typecheck/consumer_contract.py typecheck/activity_contract.py

  wheel-smoke:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv wheel-smoke
      - run: wheel-smoke/bin/python -m pip install dist/*.whl
      - run: wheel-smoke/bin/python -c "from ai_team_team import ATTConfig, ATTManager, Agent, Tool; print(ATTConfig(), ATTManager, Agent, Tool)"
      - name: Exercise installed runtime examples outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "${{ github.workspace }}/wheel-smoke/bin/python" -c "import sys; from pathlib import Path; import ai_team_team; assert Path(ai_team_team.__file__).is_relative_to(Path(sys.prefix))"
          "${{ github.workspace }}/wheel-smoke/bin/python" "${{ github.workspace }}/examples/personal_activity.py"
          "${{ github.workspace }}/wheel-smoke/bin/python" "${{ github.workspace }}/examples/personal_activity.py" --text
          "${{ github.workspace }}/wheel-smoke/bin/python" "${{ github.workspace }}/examples/background_tasks.py"
