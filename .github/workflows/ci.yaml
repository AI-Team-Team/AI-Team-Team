name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Install Coverage
        id: coverage_install
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: python -m pip install "coverage[toml]>=7.6.0"

      - name: Run tests
        if: ${{ matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13' }}
        run: python -m unittest discover -s test

      - name: Run tests with Coverage
        id: coverage_tests
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: python -m coverage run -m unittest discover -s test

      - name: Generate Coverage reports
        id: coverage_reports
        if: >-
          ${{ !cancelled() && steps.coverage_install.outcome == 'success' &&
              (steps.coverage_tests.outcome == 'success' || steps.coverage_tests.outcome == 'failure') }}
        shell: bash
        run: |
          if [[ -f .coverage ]]; then
            python -m coverage html --fail-under=0
            python -m coverage xml --fail-under=0
            python -m coverage report -m
          else
            echo "No coverage data was generated."
            exit 1
          fi

      - name: Upload Coverage reports
        if: >-
          ${{ !cancelled() &&
              (steps.coverage_reports.outcome == 'success' || steps.coverage_reports.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: att-coverage
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src test typecheck
      - run: mypy typecheck/consumer_contract.py typecheck/activity_contract.py

  wheel-smoke:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv wheel-smoke
      - run: wheel-smoke/bin/python -m pip install dist/*.whl
      - run: wheel-smoke/bin/python -c "from ai_team_team import ATTConfig, ATTManager, Agent, Tool; print(ATTConfig(), ATTManager, Agent, Tool)"
